
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snoopy</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>

<body>

    <header>

        <h1>Snoopy </h1>

        <p>
            Bienvenido al mundo de Snoopy 🐾<br>
            Snoopy no habla, pero tiene mucha imaginación.<br>
A lo largo de Peanuts, Snoopy adopta diferentes personalidades y profesiones..
        </p>

    </header>


    <main>

        <section>

            <h2>¿Qué Snoopy eres hoy?</h2>

            <!-- Carrusel -->
            <div id="carrus"></div>


            <!-- Botón para abrir el modal -->
            <div class="contenedor-boton">

                <button
                    id="btnInfo"
                    class="boton-principal">

                    ✨ Ver información

                </button>

            </div>

        </section>

    </main>


    <!-- Librería -->
    <script src="js/componennte.js"></script>


    <script>

        // Crear carrusel
        crearCarrusel(
            "carrus",

            [
                "img/img2.jpg",
                "img/img4.jpg",
                "img/img5.jpg",
                "img/img7.jpg",
                "img/img8.jpg"
            ],

            {
                ancho: "500px",
                alto: "714px"
            }
        );


        // Abrir modal
        document
            .getElementById("btnInfo")
            .addEventListener("click", function () {

                mostrarModal(
                    "🐾 Curiosidades ",
                    " ¿Sabías que Snoopy tiene más de 100 personalidades? Snoopy es un beagle, pero en su imaginación puede convertirse en piloto, escritor, detective y muchas cosas más.¡Únete al Club Snoopy! ",
                     
                );

            });

    </script>

</body>

</html>

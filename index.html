
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snoopy</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>

<body>

    <header>

        <h1>Snoopy </h1>

        <p>
            Bienvenido al mundo de Snoopy 🐾<br>
            Un pequeño beagle con una gran imaginación que ha
            conquistado generaciones con sus aventuras,
            ocurrencias y su inseparable amigo Woodstock.
        </p>

    </header>


    <main>

        <section>

            <h2>Galería de Snoopy</h2>

            <!-- Carrusel -->
            <div id="carrus"></div>


            <!-- Botón para abrir el modal -->
            <div class="contenedor-boton">

                <button
                    id="btnInfo"
                    class="boton-principal">

                    ✨ Ver información

                </button>

            </div>

        </section>

    </main>


    <!-- Librería -->
    <script src="js/componennte.js"></script>


    <script>

        // Crear carrusel
        crearCarrusel(
            "carrus",

            [
                "img/img2.jpg",
                "img/img4.jpg",
                "img/img5.jpg",
                "img/img6.jpg",
                "img/img7.jpg",
                "img/img8.jpg"
            ],

            {
                ancho: "500px",
                alto: "714px"
            }
        );


        // Abrir modal
        document
            .getElementById("btnInfo")
            .addEventListener("click", function () {

                mostrarModal(
                    "🐾 Sobre Snoopy",
                    "Snoopy es un pequeño beagle creado por Charles M. Schulz. Es conocido por su gran imaginación, sus aventuras como escritor y piloto, y por su amistad con Woodstock."
                );

            });

    </script>

</body>

</html>
